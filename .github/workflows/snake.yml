name: Generate contribution snake

on:
  schedule:
    - cron: "47 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate vaporwave snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff4fa3&color_dots=#ebedf0,#d8b4fe,#c084fc,#2dd4bf,#14b8a6
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff66aa&color_dots=#0d1117,#2b1457,#5b21b6,#00d4aa,#c8a2ff

      - name: Publish animation to output branch
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
