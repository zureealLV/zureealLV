name: Refresh profile data

on:
  schedule:
    - cron: "23 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile-data
  cancel-in-progress: true

jobs:
  update-profile-data:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out profile repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Fetch current osu! statistics
        run: python scripts/update_osu_stats.py

      - name: Refresh self-hosted GitHub telemetry
        run: python scripts/update_github_telemetry.py

      - name: Commit changed profile data
        shell: bash
        run: |
          if git diff --quiet -- README.md assets/telemetry; then
            echo "No profile data changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/telemetry
          git commit -m "chore: refresh profile data"
          git push
